<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acme Redesign — Demo (Developer view)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 48px; max-width: 720px; color: #111827; }
  h1 { margin-top: 0; }
  img { max-width: 100%; border-radius: 12px; }
  .badge { display: inline-block; background: #ecfdf5; color: #047857; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
  <span class="badge">Developer view</span>
  <h1>Acme Redesign — Demo</h1>
  <p>Same page as the client sees. As the developer you can mark feedback <strong>resolved</strong>, delete stray notes, and use the <strong>Hide</strong> button to turn the overlay off for everyone once the project ships.</p>
  <img src="https://picsum.photos/700/300" alt="placeholder hero" />
  <p>Open <a href="client.html">client.html</a> in another window to see annotations sync in real time.</p>

  <!-- Build the SDK first: npm run build --workspace packages/core -->
  <script src="../../packages/core/dist/pointout.iife.js"></script>
  <script>
    PointOut.init({
      project: 'acme-redesign',
      server: 'ws://localhost:8787',
      token: 'local-dev-secret',
      user: { name: 'Developer', role: 'developer' },
    });
  </script>
</body>
</html>
